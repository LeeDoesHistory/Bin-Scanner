<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crate Scanner — Vinyl & 78 Archive Tool</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #ffffff;
    --accent-text: #0f172a;
    --blue: #3b82f6;
    --blue-hover: #2563eb;
    --green: #10b981;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    max-width: 540px;
    margin-inline: auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .badge {
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
  }
  /* White & Blue Button Theme */
  button.primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
    box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
  }
  button.primary:hover { background: #e2e8f0; }

  button.secondary {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--blue);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary:hover { background: var(--blue-hover); }
  
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-row button {
    margin-top: 0;
    flex: 1;
  }
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  video, #previewImg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .reticle {
    position: absolute;
    inset: 14%;
    border: 2px dashed rgba(255, 255, 255, 0.75);
    border-radius: 50%;
    pointer-events: none;
  }
  .verdict {
    padding: 12px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 10px;
    text-align: center;
  }
  .verdict.new { background: rgba(16, 185, 129, 0.18); border: 1px solid var(--green); color: #6ee7b7; }
  .verdict.owned { background: rgba(59, 130, 246, 0.18); border: 1px solid var(--blue); color: #93c5fd; }
