<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crate Scanner — Vinyl &amp; 78 Archive Tool</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --white: #ffffff;
    --white-text: #0f172a;
    --blue: #2563eb;
    --blue-bright: #3b82f6;
    --green: #10b981;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    max-width: 540px;
    margin-inline: auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    color: var(--white);
  }
  .badge {
    font-size: 0.75rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--blue-bright);
    color: #93c5fd;
    font-weight: 600;
  }
  .tabs, .mode-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tab-btn, .mode-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--white);
    color: var(--white-text);
    border-color: var(--white);
  }
  .mode-btn.active {
    background: var(--blue);
    color: var(--white);
    border-color: var(--blue-bright);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    font-size: 0.95rem;
  }
  button.primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--white);
    color: var(--white-text);
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
  }
  button.secondary {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--blue-bright);
    background: var(--blue);
    color: var(--white);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .btn-row button { margin-top: 0; flex: 1; }
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  video, #previewImg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .reticle-standard {
    position: absolute;
    inset: 12%;
    border: 2px dashed rgba(255, 255, 255, 0.85);
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 0 999px rgba(15, 23, 42, 0.35);
  }
  .reticle-standard::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 14px;
    height: 14px;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 255, 255, 0.9);
    border-radius: 50%;
  }
  .reticle-45 {
    position: absolute;
    inset: 18%;
    border: 2px dashed rgba(96, 165, 250, 0.95);
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 0 999px rgba(15, 23, 42, 0.45);
  }
  .reticle-45::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 34%;

    transform: translate(-50%, -50%);
    border: 2px dashed rgba(255, 255, 255, 0.95);
    border-radius: 50%;
  }
  .verdict {
    padding: 12px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 10px;
    text-align: center;
  }

  .verdict.grail { background: rgba(255, 255, 255, 0.18); border: 1px solid var(--white); color: var(--white); }
