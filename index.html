<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crate Scanner — Vinyl & 78 Archive Tool</title>
<style>
  :root {
    --bg: #111317;
    --card: #1a1d24;
    --border: #2c313d;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #f59e0b;
    --green: #10b981;
    --blue: #3b82f6;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    max-width: 540px;
    margin-inline: auto;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    letter-spacing: 0.3px;
  }
  .badge {
    font-size: 0.75rem;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
  }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d0f12;
    color: var(--text);
    font-size: 0.95rem;
  }
  button.primary {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #111;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
  }
  button.secondary {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #232730;
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 8px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .camera-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #000;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  video, #previewImg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .reticle {
    position: absolute;
    inset: 14%;
    border: 2px dashed rgba(245, 158, 11, 0.75);
    border-radius: 50%;
    pointer-events: none;
  }
  .verdict {
    padding: 12px 14px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 10px;
    text-align: center;
  }
  .verdict.new { background: rgba(16, 185, 129, 0.18); border: 1px solid var(--green); color: #6ee7b7; }
  .verdict.owned { background: rgba(59, 130, 246, 0.18); border: 1px solid var(--blue); color: #93c5fd; }
  .verdict.grail { background: rgba(245, 158, 11, 0.22); border: 1px solid var(--accent); color: #fcd34d; }
  .flag-pill {
    display: inline-block;
    background: rgba(245, 158, 11, 0.18);
    border: 1px solid var(--accent);
    color: #fcd34d;
    padding: 3px 8px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    margin: 3px 4px 3px 0;
  }
  .meta-row {
    font-size: 0.9rem;
    margin: 6px 0;
    line-height: 1.4;
  }
  .meta-row strong { color: var(--muted); font-weight: 600; }
  .status-log {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 8px;
    white-space: pre-wrap;
  }
  a.btn-link {
    display: block;
    text-align: center;
    text-decoration: none;
    padding: 11px;
    border-radius: 10px;
    background: #232730;
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
    margin-top: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Crate Scanner</h1>
  <span class="badge" id="syncBadge">Archive: 0 items</span>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('scan')">Scan Label</button>
  <button class="tab-btn" onclick="switchTab('setup')">Archive Sync & Keys</button>
</div>

<!-- SCAN PANEL -->
<div id="panel-scan" class="panel active">
  <div class="camera-wrap">
    <video id="video" autoplay playsinline></video>
    <img id="previewImg" style="display:none;" alt="Captured label" />
    <div class="reticle" title="Center record label here"></div>
  </div>

  <button class="primary" id="snapBtn" onclick="captureAndScan()">Snap &amp; Identify Label</button>
  <button class="secondary" id="retakeBtn" style="display:none;" onclick="resetCamera()">Back to Live Camera</button>
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFileUpload(event)" />
  <button class="secondary" onclick="document.getElementById('fileInput').click()">Or Pick / Take Photo</button>

  <div class="status-log" id="scanStatus">Ready. Center a record label inside the circle and tap Snap.</div>

  <div class="card" id="resultCard" style="display:none;">
    <div id="verdictBanner" class="verdict new">NEW TO ARCHIVE</div>
    <div id="flagsWrap" style="margin-bottom:8px;"></div>
    <div class="meta-row"><strong>Artist:</strong> <span id="resArtist">—</span></div>
    <div class="meta-row"><strong>Title:</strong> <span id="resTitle">—</span></div>
    <div class="meta-row"><strong>Label &amp; Cat#:</strong> <span id="resCat">—</span></div>
    <div class="meta-row"><strong>Format / Era:</strong> <span id="resFormat">—</span></div>
    <div class="meta-row"><strong>Notes:</strong> <span id="resNotes">—</span></div>
    <div class="meta-row" id="matchDetailWrap" style="display:none;"><strong>Archive Match:</strong> <span id="resMatch">—</span></div>
    <a id="discogsLink" class="btn-link" href="#" target="_blank" rel="noopener">Open Search on Discogs Web</a>
  </div>
</div>

<!-- SETUP PANEL -->
<div id="panel-setup" class="panel">
  <div class="card">
    <label for="geminiKey">Free Gemini API Key (Google AI Studio)</label>
    <input type="password" id="geminiKey" placeholder="AIzaSy..." />

    <label for="discogsUser">Discogs Username</label>
    <input type="text" id="discogsUser" placeholder="YourDiscogsUsername" />

    <label for="discogsToken">Discogs Personal Access Token</label>
    <input type="password" id="discogsToken" placeholder="Your Discogs token..." />

    <button class="primary" id="saveKeysBtn" onclick="saveSettings()">Save Keys</button>
    <button class="secondary" id="syncBtn" onclick="syncDiscogsCollection()">Sync Full Discogs Collection &amp; Wantlist</button>
    <div class="status-log" id="syncStatus">Keys are stored locally on your phone only.</div>
  </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
  let stream = null;
  let archiveItems = [];
  let wantlistItems = [];

  const GRAIL_CATS = ["11009", "11010", "11011", "A-808", "47-6325", "20-6325", "5358", "R-415", "5011", "R-5004"];
  const PRIORITY_ARTISTS = ["johnny cash", "tommy cash", "marty robbins", "elton britt", "al bowlly", "sheldon allman", "frank sinatra", "buddy holly", "duane eddy", "bing crosby", "ink spots", "ella fitzgerald"];

  function init() {
    document.getElementById("geminiKey").value = localStorage.getItem("cs_geminiKey") || "";
    document.getElementById("discogsUser").value = localStorage.getItem("cs_discogsUser") || "";
    document.getElementById("discogsToken").value = localStorage.getItem("cs_discogsToken") || "";

    try {
      archiveItems = JSON.parse(localStorage.getItem("cs_archive") || "[]");
      wantlistItems = JSON.parse(localStorage.getItem("cs_wantlist") || "[]");
    } catch (e) {
      archiveItems = [];
      wantlistItems = [];
    }
    updateBadge();
    startCamera();
  }

  function updateBadge() {
    document.getElementById("syncBadge").textContent = `Archive: ${archiveItems.length} | Want: ${wantlistItems.length}`;
  }

  function switchTab(tab) {
    document.querySelectorAll(".tab-btn").forEach((b, i) => {
      b.classList.toggle("active", (tab === "scan" && i === 0) || (tab === "setup" && i === 1));
    });
    document.getElementById("panel-scan").classList.toggle("active", tab === "scan");
    document.getElementById("panel-setup").classList.toggle("active", tab === "setup");
  }

  function saveSettings() {
    const statusEl = document.getElementById("syncStatus");
    const btn = document.getElementById("saveKeysBtn");
    try {
      localStorage.setItem("cs_geminiKey", document.getElementById("geminiKey").value.trim());
      localStorage.setItem("cs_discogsUser", document.getElementById("discogsUser").value.trim());
      localStorage.setItem("cs_discogsToken", document.getElementById("discogsToken").value.trim());
      
      statusEl.style.color = "#6ee7b7";
      statusEl.textContent = "Saved successfully locally on this device.";
      if (btn) {
        const orig = btn.textContent;
        btn.textContent = "Saved ✓";
        setTimeout(() => btn.textContent = orig, 1500);
      }
    } catch (err) {
      statusEl.style.color = "#ef4444";
      statusEl.textContent = `Save error: ${err.message}`;
    }
  }

  async function startCamera() {
    const video = document.getElementById("video");
    try {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 1280 } },
        audio: false
      });
      video.srcObject = stream;
      video.style.display = "block";
      document.getElementById("previewImg").style.display = "none";
    } catch (err) {
      document.getElementById("scanStatus").textContent = "Camera preview unavailable (requires HTTPS or permission). Use 'Or Pick / Take Photo' below.";
    }
  }

  function resetCamera() {
    document.getElementById("retakeBtn").style.display = "none";
    document.getElementById("snapBtn").style.display = "block";
    document.getElementById("resultCard").style.display = "none";
    startCamera();
  }

  async function fetchAllPages(urlBase, token, statusEl, label) {
    let page = 1;
    let totalPages = 1;
    let collected = [];

    while (page <= totalPages) {
      statusEl.textContent = `Syncing ${label}: page ${page} of ${totalPages}...`;
      const sep = urlBase.includes("?") ? "&" : "?";
      const res = await fetch(`${urlBase}${sep}page=${page}&per_page=100`, {
        headers: {
          "Authorization": `Discogs token=${token}`,
          "User-Agent": "PersonalCrateScanner/1.0"
        }
      });
      if (!res.ok) {
        throw new Error(`Discogs HTTP ${res.status}`);
      }
      const data = await res.json();
      totalPages = data.pagination ? data.pagination.pages : 1;
      const list = data.releases || data.wants || [];
      for (const item of list) {
        const info = item.basic_information || {};
        collected.push({
          id: info.id,
          title: info.title || "",
          year: info.year || "",
          artists: (info.artists || []).map(a => a.name).join(", "),
          labels: (info.labels || []).map(l => `${l.name} ${l.catno}`).join(" | "),
          catnos: (info.labels || []).map(l => (l.catno || "").toLowerCase().replace(/[^a-z0-9]/g, "")),
          formats: (info.formats || []).map(f => f.name).join(", ")
        });
      }
      page++;
      await new Promise(r => setTimeout(r, 350));
    }
    return collected;
  }

  async function syncDiscogsCollection() {
    saveSettings();
    const user = localStorage.getItem("cs_discogsUser");
    const token = localStorage.getItem("cs_discogsToken");
    const statusEl = document.getElementById("syncStatus");
    const btn = document.getElementById("syncBtn");

    if (!user || !token) {
      statusEl.textContent = "Enter both your Discogs Username and Personal Access Token first.";
      return;
    }

    btn.disabled = true;
    try {
      archiveItems = await fetchAllPages(
        `https://api.discogs.com/users/${encodeURIComponent(user)}/collection/folders/0/releases`,
        token,
        statusEl,
        "Collection"
      );
      wantlistItems = await fetchAllPages(
        `https://api.discogs.com/users/${encodeURIComponent(user)}/wants`,
        token,
        statusEl,
        "Wantlist"
      );
      localStorage.setItem("cs_archive", JSON.stringify(archiveItems));
      localStorage.setItem("cs_wantlist", JSON.stringify(wantlistItems));
      updateBadge();
      statusEl.textContent = `Done! Cached ${archiveItems.length} collection items and ${wantlistItems.length} wantlist items for instant offline checks.`;
    } catch (err) {
      statusEl.textContent = `Sync failed: ${err.message}. Check your username and token.`;
    } finally {
      btn.disabled = false;
    }
  }

  async function captureAndScan() {
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const preview = document.getElementById("previewImg");

    if (!video.videoWidth) {
      document.getElementById("fileInput").click();
      return;
    }

    const size = Math.min(video.videoWidth, video.videoHeight);
    const sx = (video.videoWidth - size) / 2;
    const sy = (video.videoHeight - size) / 2;
    canvas.width = 900;
    canvas.height = 900;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, sx, sy, size, size, 0, 0, 900, 900);

    const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
    preview.src = dataUrl;
    preview.style.display = "block";
